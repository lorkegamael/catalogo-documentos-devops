<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo documental</title>
<style>
*{box-sizing:border-box}body{max-width:820px;margin:auto;padding:8vh 5vw;font:1rem/1.55 system-ui;color:#163537;background:#f5f4ee}
header{border-bottom:2px solid #18695f;padding-bottom:1rem}h1{font:clamp(2.2rem,6vw,4rem)/1.05 Georgia;margin:.4em 0}
small{color:#395953}select{padding:.5rem;max-width:100%}ul{padding:0;list-style:none}li{border-bottom:1px solid #bed0c9;padding:1em 0}li small{display:block}
</style><header><small>UNIDAD ADMINISTRATIVA</small><h1>Catálogo documental</h1>
<p id="estado" role="status">Consultando el servicio…</p></header>
<p><label for="categoria">Categoría </label><select id="categoria"><option value="">Todas</option></select></p>
<ul id="lista"></ul><p id="aviso" role="status"></p>
<script>
const lista = document.querySelector("#lista");
const filtro = document.querySelector("#categoria");
let documentos = [];
function mostrar() {
  const filas = documentos.filter(d => !filtro.value || d.categoria === filtro.value);
  lista.replaceChildren();
  for (const d of filas) {
    const item = document.createElement("li");
    const detalle = document.createElement("small");
    detalle.textContent = [d.id, d.categoria, "Versión " + d.version].join(" · ");
    item.append(d.titulo, detalle);
    lista.append(item);
  }
  document.querySelector("#aviso").textContent = filas.length + " documentos";
}
async function obtener(ruta) {
  const r = await fetch(ruta, {cache:"no-store"});
  if (!r.ok) throw Error(String(r.status));
  return r.json();
}
async function iniciar() {
  try {
    const salud = await obtener("/health");
    if (salud.estado !== "ok") throw Error("salud");
    document.querySelector("#estado").textContent = "Servicio disponible";
    documentos = (await obtener("/api/documentos")).documentos;
    for (const categoria of new Set(documentos.map(d => d.categoria))) {
      filtro.add(new Option(categoria, categoria));
    }
    mostrar();
  } catch {
    filtro.disabled = true;
    document.querySelector("#estado").textContent = "Servicio no disponible. Vuelve a cargar la página.";
  }
}
filtro.addEventListener("change", mostrar);
iniciar();
</script></html>
